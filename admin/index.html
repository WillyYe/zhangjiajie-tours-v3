<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>张家界后台 · Content Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">⛰ 张家界后台</div>

    <div class="settings-card">
      <div class="settings-card-head">
        <span id="settingsDot" class="dot"></span>
        <span id="settingsText">未配置</span>
        <button id="openSettings" class="icon-btn" title="GitHub 设置">⚙</button>
      </div>
      <div class="settings-card-body">
        <div class="settings-summary" id="settingsSummary">点击 ⚙ 设置 GitHub</div>
      </div>
    </div>

    <div class="sidebar-status">
      <span id="statusDot" class="dot ok"></span>
      <span id="statusText">就绪</span>
    </div>

    <div class="nav-group-title">内容模块</div>
    <nav class="module-list">
      <button class="module active" data-module="hotels">🏨 酒店 Hotels</button>
      <button class="module" data-module="hero">🖼 首屏 Hero</button>
      <button class="module" data-module="topAttractions">🏞 景点 Top Attractions</button>
    </nav>

    <div class="nav-group-title">首页区块</div>
    <nav class="module-list">
      <button class="module" data-module="nav">🧭 顶部导航 Nav</button>
      <button class="module" data-module="welcome">📝 欢迎区 Welcome</button>
    </nav>

    <div class="nav-group-title">内容页面（规划中）</div>
    <nav class="module-list">
      <button class="module disabled" disabled>📖 指南 Guides</button>
      <button class="module disabled" disabled>🍜 美食 Food</button>
    </nav>

    <div class="sidebar-footer">
      <button class="module settings-module" data-action="settings" id="openSettings2">⚙ 设置 Settings</button>
    </div>
  </aside>

  <div class="resizer" data-resizer="sidebar" title="左右拖动调整侧栏宽度"></div>

  <main class="content">
    <header class="content-head">
      <div>
        <h1 id="modTitle">酒店 Hotels</h1>
        <p class="hint" id="modHint">改完右侧实时预览，满意后点「保存并发布」即可上线。</p>
      </div>
      <div class="actions">
        <button id="saveBtn" class="btn primary" disabled>💾 保存并发布</button>
        <button id="reloadBtn" class="btn">↻ 重新加载</button>
      </div>
    </header>

    <div class="editor-grid">
      <section class="editor" id="editor"></section>
      <div class="resizer" data-resizer="preview" title="左右拖动调整预览区宽度"></div>
      <aside class="preview">
        <div class="preview-head">
          <h3 id="previewTitle">实时预览 · 酒店</h3>
          <div class="preview-tabs" id="previewTabs" hidden>
            <button type="button" class="ptab active" data-mode="card" title="酒店卡片预览（用于分类列表）">🃏 卡片</button>
            <button type="button" class="ptab" data-mode="detail" title="三级详情页预览（独立页面）">📄 详情</button>
          </div>
        </div>
        <div id="preview"></div>
      </aside>
    </div>
  </main>
</div>

<!-- 设置弹窗 -->
<div class="modal-mask" id="settingsModal" hidden>
  <div class="modal settings-modal">
    <div class="modal-header">
      <div class="modal-icon">⚙️</div>
      <div>
        <h2>GitHub 连接设置</h2>
        <p class="modal-subtitle">配置后可直接在后台保存并发布内容</p>
      </div>
    </div>

    <div class="settings-section">
      <h3 class="section-title">🔐 访问令牌</h3>
      <p class="section-desc">Token 只保存在本浏览器，不会上传任何服务器。不填 Token 时仍可读取数据。</p>
      <div class="token-field">
        <input id="cfgToken" type="password" placeholder="ghp_xxx 或 github_pat_xxx">
        <button id="toggleToken" type="button" class="btn-ghost btn-sm">👁 显示</button>
      </div>
      <p class="hint">在 <a href="https://github.com/settings/tokens" target="_blank">github.com/settings/tokens</a> 生成，需有本仓库 <code>Contents: read &amp; write</code> 权限。</p>
    </div>

    <div class="settings-section">
      <h3 class="section-title">📦 仓库与分支</h3>
      <div class="field-row">
        <div class="field">
          <label>仓库 <span class="tip">owner/repo</span></label>
          <input id="cfgRepo" placeholder="如 WillyYe/zhangjiajie-tours-v3">
        </div>
        <div class="field field-sm">
          <label>分支</label>
          <input id="cfgBranch" placeholder="main">
        </div>
      </div>
    </div>

    <div class="status-box" id="settingsStatusBox" hidden>
      <span id="settingsStatus"></span>
    </div>

    <div class="modal-actions">
      <button id="closeSettings" class="btn">关闭</button>
      <button id="testSettings" class="btn">测试连接</button>
      <button id="saveSettings" class="btn primary">保存设置</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<!-- 缓存破坏：所有 ES 模块映射到 ?v=<content-hash>，入口 app.js 也带版本。
     由 scripts/cache-bust-admin.mjs 在提交/CI 时注入真实 hash，避免「HTML 更新但 JS 仍是旧缓存」的混合态。 -->
<script type="importmap" id="admin-importmap">
{
  "imports": {
    "./github.js": "./github.js?v=3c82be6efa",
    "./imglib-core.js": "./imglib-core.js?v=3c82be6efa",
    "./mjs.js": "./mjs.js?v=3c82be6efa",
    "./modules/hero.js": "./modules/hero.js?v=3c82be6efa",
    "./modules/hotels.js": "./modules/hotels.js?v=3c82be6efa",
    "./modules/nav-render.js": "./modules/nav-render.js?v=3c82be6efa",
    "./modules/nav.js": "./modules/nav.js?v=3c82be6efa",
    "./modules/settings.js": "./modules/settings.js?v=3c82be6efa",
    "./modules/top-attractions-render.js": "./modules/top-attractions-render.js?v=3c82be6efa",
    "./modules/top-attractions.js": "./modules/top-attractions.js?v=3c82be6efa",
    "./modules/welcome-render.js": "./modules/welcome-render.js?v=3c82be6efa",
    "./modules/welcome.js": "./modules/welcome.js?v=3c82be6efa",
    "./resizer.js": "./resizer.js?v=3c82be6efa"
  }
}
</script>
<script type="module" src="app.js?v=3c82be6efa"></script>
</body>
</html>
