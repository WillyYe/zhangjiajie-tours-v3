name: Rebuild front-end pages (all data-driven modules)

# Loop Engineering: 后台(admin) 通过 GitHub Contents API 写入任意 *-data.mjs 后，
# 自动重新生成全部静态 HTML（hotels/ attractions/ experiences/ food/ tours/ plan/
# 以及 index.html 的 Hero/导航/Top8/Tour 区块），保证「后台改动 → 前台即时更新」。
#
# 关键不变量（由 tests/publish-loop.mjs 静态门禁守护）：
#   - paths 必须覆盖全部数据源（含 attractions/experiences/tours 等曾被遗漏的模块）
#   - 必须跑全部 build-*.mjs（单一 build-hotels.mjs 只覆盖 hotels+home）
#   - commit 时 git add 必须包含全部产物目录 + index.html
#
# 新增数据源时：① 把 'xxx-data.mjs' 加进 paths；② 在下方 build 步骤加一行
#   `node scripts/build-xxx.mjs`；③ 把产物目录加进 git add。然后更新 publish-loop.mjs。
on:
  push:
    branches: [main]
    paths:
      - 'hotels-data.mjs'
      - 'home-data.mjs'
      - 'attractions-data.mjs'
      - 'experiences-data.mjs'
      - 'food-data.mjs'
      - 'tours-data.mjs'
      - 'plan-guides-data.mjs'
      - 'module-index-data.mjs'
      # 模板 / 构建脚本变更也会改变产物 → 同样触发重建
      - 'templates/**'
      - 'scripts/build-*.mjs'
      - 'scripts/fragments.mjs'
      - 'scripts/index-nav.mjs'
      - 'admin/modules/nav-render.js'
      - 'admin/modules/top-attractions-render.js'

concurrency:
  group: rebuild-front-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Regenerate all front-end pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 顺序无关：每个 build 脚本只读取 *-data.mjs（数据源），写入各自产物目录。
      - name: Build all front-end pages
        run: |
          node scripts/build-hotels.mjs
          node scripts/build-attractions.mjs
          node scripts/build-experiences.mjs
          node scripts/build-food.mjs
          node scripts/build-tours.mjs
          node scripts/build-plan-guides.mjs
          node scripts/build-module-index.mjs
          node scripts/build-top-attractions.mjs

      - name: Commit and push regenerated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- hotels/ attractions/ experiences/ food/ tours/ plan/ index.html; then
            git add hotels/ attractions/ experiences/ food/ tours/ plan/ index.html
            git commit -m "chore: rebuild front-end pages from data files [skip ci]"
            git push
            echo "Regenerated and pushed front-end pages."
          else
            echo "No front-end changes to commit."
          fi
